<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 100 64">
  <defs>
    <pattern id="tile" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" fill="none" stroke="#1A2433" stroke-width=".08"/>
    </pattern>
    <style>
      .paper{fill:#0D1420}
      .slab{fill:#111827;stroke:#D8E1EC;stroke-width:.36}
      .room{fill:#141C2A;stroke:#A7B4C6;stroke-width:.28}
      .service{fill:#101824;stroke:#6F8196;stroke-width:.24}
      .control{fill:#241B20;stroke:#A7B4C6;stroke-width:.28}
      .wall{fill:none;stroke:#E5E7EB;stroke-width:.34;stroke-linejoin:round}
      .partition{fill:none;stroke:#8FA2B8;stroke-width:.22;stroke-linejoin:round}
      .door{fill:none;stroke:#60A5FA;stroke-width:.26;stroke-linecap:round}
      .label{fill:#AAB7C8;font-family:Inter,Arial,sans-serif;font-size:1.35px;font-weight:700;letter-spacing:.04px}
      .small{fill:#7F8EA3;font-family:Inter,Arial,sans-serif;font-size:.95px;font-weight:700;letter-spacing:.04px}
    </style>
  </defs>
  <rect width="100" height="64" fill="#070A0F"/>
  <rect x="12" y="10" width="76" height="44" rx="1.1" class="paper"/>
  <rect x="12" y="10" width="76" height="44" fill="url(#tile)" opacity=".55"/>
  <rect x="14" y="12" width="72" height="40" rx=".6" class="slab"/>
  <path class="wall" d="M17 15H83V50H17Z"/>
  <path class="partition" d="M17 42H60V15M60 24H83M60 38H83M38 42V50"/>
  <rect x="19" y="18" width="39" height="22" class="room"/>
  <rect x="62" y="26" width="18" height="10" class="control"/>
  <rect x="62" y="40" width="18" height="10" class="service"/>
  <rect x="20" y="43.5" width="16" height="6.5" class="service"/>
  <path class="door" d="M38 50v7M60 31h2M60 45h2M80 31h7"/>
  <text x="23" y="24" class="label">MAIN LOBBY</text>
  <text x="65" y="31" class="label">BADGE LANES</text>
  <text x="65" y="45" class="label">ELEVATORS</text>
  <text x="22" y="48" class="small">SECURITY DESK</text>
</svg>
