<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 100 64">
  <defs>
    <pattern id="tile" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" fill="none" stroke="#1E293B" stroke-width=".14"/>
    </pattern>
    <style>
      .shell{fill:#0F172A;stroke:#E2E8F0;stroke-width:1.25}
      .lobby{fill:#102437;stroke:#60A5FA;stroke-width:.62}
      .restricted{fill:#2A1115;stroke:#FF453A;stroke-width:.78}
      .service{fill:#18212F;stroke:#64748B;stroke-width:.52}
      .label{fill:#CBD5E1;font-family:Inter,Arial,sans-serif;font-size:2px;font-weight:700}
      .small{fill:#94A3B8;font-family:Inter,Arial,sans-serif;font-size:1.45px;font-weight:600}
      .door{stroke:#60A5FA;stroke-width:.65;stroke-linecap:round}
    </style>
  </defs>
  <rect width="100" height="64" fill="#0B0E14"/>
  <rect x="12" y="10" width="76" height="44" rx="1.4" class="shell"/>
  <rect x="12" y="10" width="76" height="44" fill="url(#tile)" opacity=".65"/>
  <rect x="18" y="18" width="42" height="24" class="lobby"/>
  <rect x="62" y="24" width="20" height="12" class="restricted"/>
  <rect x="62" y="40" width="20" height="12" class="service"/>
  <rect x="20" y="44" width="18" height="8" class="service"/>
  <path d="M39 54v6 M60 30h2 M60 46h2 M82 30h6" class="door"/>
  <text x="23" y="24" class="label">MAIN LOBBY</text>
  <text x="65" y="29" class="label">BADGE LANES</text>
  <text x="65" y="45" class="label">ELEVATORS</text>
  <text x="22" y="49" class="small">SECURITY DESK</text>
</svg>
