<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 100 64">
  <defs>
    <pattern id="rack" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect x=".6" y=".8" width="3.8" height=".7" fill="#334155"/>
      <rect x=".6" y="2.5" width="3.8" height=".7" fill="#334155"/>
    </pattern>
    <style>
      .shell{fill:#0F172A;stroke:#E2E8F0;stroke-width:1.25}
      .wall{fill:#111827;stroke:#CBD5E1;stroke-width:.62}
      .corridor{fill:#172033;stroke:#94A3B8;stroke-width:.45}
      .restricted{fill:#2A1115;stroke:#FF453A;stroke-width:.78}
      .service{fill:#18212F;stroke:#64748B;stroke-width:.52}
      .label{fill:#CBD5E1;font-family:Inter,Arial,sans-serif;font-size:2px;font-weight:700}
      .small{fill:#94A3B8;font-family:Inter,Arial,sans-serif;font-size:1.45px;font-weight:600}
      .door{stroke:#60A5FA;stroke-width:.65;stroke-linecap:round}
    </style>
  </defs>
  <rect width="100" height="64" fill="#0B0E14"/>
  <rect x="4" y="6" width="92" height="52" rx="1.4" class="shell"/>
  <rect x="8" y="20" width="24" height="22" class="restricted"/>
  <rect x="38" y="12" width="12" height="42" class="corridor"/>
  <rect x="32" y="29" width="52" height="8" class="corridor"/>
  <rect x="55" y="12" width="30" height="16" class="wall"/>
  <rect x="55" y="40" width="30" height="14" class="service"/>
  <rect x="10" y="44" width="22" height="10" fill="url(#rack)" stroke="#64748B" stroke-width=".45"/>
  <path d="M8 31H4 M32 31h6 M50 31h5 M84 33h10 M50 48h5" class="door"/>
  <text x="10" y="25" class="label">LOADING DOCK B</text>
  <text x="45" y="33" text-anchor="middle" class="label">AISLE 5</text>
  <text x="68" y="34" text-anchor="middle" class="label">CROSS-DOCK</text>
  <text x="58" y="17" class="label">STORAGE</text>
  <text x="58" y="45" class="label">SHIFT OFFICE</text>
  <text x="12" y="50" class="small">RACKS</text>
</svg>
