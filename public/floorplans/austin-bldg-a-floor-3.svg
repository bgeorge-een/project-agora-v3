  <text x="86" y="12" class="small">NET</text>
  <text x="38" y="33" text-anchor="middle" class="label">WEST CORRIDOR</text>
  <text x="72" y="33" text-anchor="middle" class="label">SERVER CORRIDOR</text>
  <text x="10" y="44" class="label">ELEVATOR LOBBY</text>
  <text x="33" y="44" class="label">IT SECURITY</text>
  <text x="60" y="44" class="label">WORKROOM</text>
  <text x="81" y="44" class="small">STAIR B</text>
  <path d="M6 58h88" stroke="#475569" stroke-width=".4" stroke-dasharray="1.2 1.2"/>
