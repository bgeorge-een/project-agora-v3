<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 100 64">
  <defs>
    <pattern id="grid" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M 2 0 L 0 0 0 2" fill="none" stroke="#1E293B" stroke-width="0.12"/>
    </pattern>
    <style>
      .shell{fill:#0F172A;stroke:#E2E8F0;stroke-width:1.25}
      .wall{fill:#111827;stroke:#CBD5E1;stroke-width:.62}
      .corridor{fill:#172033;stroke:#94A3B8;stroke-width:.45}
      .restricted{fill:#2A1115;stroke:#FF453A;stroke-width:.78}
      .service{fill:#18212F;stroke:#64748B;stroke-width:.52}
      .label{fill:#CBD5E1;font-family:Inter,Arial,sans-serif;font-size:2px;font-weight:700}
      .small{fill:#94A3B8;font-family:Inter,Arial,sans-serif;font-size:1.45px;font-weight:600}
      .door{stroke:#60A5FA;stroke-width:.55;stroke-linecap:round}
    </style>
  </defs>
  <rect width="100" height="64" fill="#0B0E14"/>
  <rect x="3" y="3" width="94" height="58" rx="1.4" class="shell"/>
  <rect x="3" y="3" width="94" height="58" fill="url(#grid)" opacity=".55"/>
  <rect x="8" y="8" width="43" height="17" class="wall"/>
  <rect x="58" y="8" width="25" height="17" class="restricted"/>
  <rect x="85" y="8" width="8" height="17" class="restricted"/>
  <rect x="8" y="27" width="83" height="10" class="corridor"/>
  <rect x="8" y="39" width="20" height="16" class="service"/>
  <rect x="31" y="39" width="22" height="16" class="wall"/>
  <rect x="58" y="39" width="18" height="16" class="wall"/>
  <rect x="80" y="39" width="11" height="16" class="service"/>
  <path d="M51 25v2 M56 27v10 M58 25v2 M83 25v2 M85 25v2 M28 37v2 M31 37v2 M53 37v2 M76 37v2 M80 37v2" class="door"/>
  <path d="M56 32h-8 M58 18h-5 M83 17h2 M28 47h3 M76 47h4" class="door"/>
  <text x="10" y="12" class="label">OPEN OFFICE</text>
